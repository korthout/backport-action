name: Backport merged pull request
on:
  pull_request_target:
    types: [closed]
  issue_comment:
    types: [created]
permissions: {} # the job uses the backport-action app's token, not GITHUB_TOKEN
jobs:
  backport:
    name: Backport pull request
    runs-on: ubuntu-latest

    # Run on merged pull requests with a backport label (default `label_pattern`),
    # or on `/backport` comments.
    if: >
      (
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.merged &&
        contains(toJSON(github.event.pull_request.labels.*.name), '"backport ')
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/backport')
      )
    steps:
      # Pull requests opened with GITHUB_TOKEN wait for approval before CI runs.
      # The app's token makes the backport pull requests run CI right away.
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BACKPORT_ACTION_APP_CLIENT_ID }}
          private-key: ${{ secrets.BACKPORT_ACTION_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }} # backport-action pushes with it
      - name: Create backport pull requests
        uses: korthout/backport-action@8560fb503c275d433c56f05a2f64850093baa9f7 # v4.7.0
        with:
          comment_style: summary
          experimental: >
            {
              "conflict_resolution": "draft_commit_conflicts"
            }
          github_token: ${{ steps.app-token.outputs.token }}
