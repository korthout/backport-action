name: Publish

on:
  push:
    branches:
      - main
      - 'release-*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.PUBLISH_DEPLOY_KEY }}
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'package.json'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build --if-present
      - name: Package artifacts
        run: npm run package
      - name: Publish artifacts
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          commit: --signoff
          default_author: user_info
          fetch: false
          message: 'dist: build new artifacts'
          push: true
      - name: Create and move next-preview tag
        run: |
          git tag v3.next-preview --force
          git push origin v3.next-preview --force
